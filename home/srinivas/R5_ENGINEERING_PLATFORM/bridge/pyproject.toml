[tool.pytest.ini_options]
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r5-engineering-bridge"
version = "1.2.0"
description = "Synchronous communication-only bridge to local Ollama"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
engineering-bridge = "src.main:main"

[project.optional-dependencies]
test = ["pytest", "ruff", "build"]

[tool.setuptools]
packages = ["src"]
